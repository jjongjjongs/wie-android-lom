[package]
name = "wie_core_arm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Use the experimental block-caching Thumb engine (FastCpuEngine) instead of the
# reference interpreter. Opt-in so it can be A/B tested on-device; correctness is
# pinned by the differential tests in `engine::fast`.
fast_cpu = []

[dependencies]
async-trait = { workspace = true }
bytemuck = { workspace = true }
md5 = { workspace = true }
serde = { version = "^1", default-features = false, features = ["derive", "alloc"] }
spin = { workspace = true }
toml = { version = "^1", default-features = false, features = ["parse", "serde"] }
tracing = { workspace = true }

arm32_cpu = { path = "../third_party/arm32_cpu" }

wie_backend = { workspace = true }
wie_util = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gdbstub = { version = "^0.7" }
gdbstub_arch = { version = "^0.3" }
crossbeam = { version = "^0.8" }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
futures-test = { workspace = true }
test_utils = { workspace = true }
